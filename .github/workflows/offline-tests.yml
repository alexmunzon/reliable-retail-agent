name: Offline tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/video/**', '**.md', '**.jpg', '**.mp4', '**.srt']
  pull_request:
    paths-ignore: ['docs/video/**', '**.md', '**.jpg', '**.mp4', '**.srt']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create isolated Python environment
        timeout-minutes: 2
        run: |
          python3 -m venv "$RUNNER_TEMP/rra-ci"
          "$RUNNER_TEMP/rra-ci/bin/python" -m pip install --disable-pip-version-check --no-cache-dir --timeout 15 --retries 1 -r requirements-offline.txt
      - name: Run demo, metrics, and original-author offline tests
        run: '"$RUNNER_TEMP/rra-ci/bin/python" scripts/ci.py --native'
